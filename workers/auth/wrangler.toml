name = "prime-america-auth"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://auth.primeamericarealestate.com"
COOKIE_DOMAIN = ".primeamericarealestate.com"
WORKSPACE_URL = "https://workspace.primeamericany.com"
# Configure INTERNAL_API_SECRET with `wrangler secret put INTERNAL_API_SECRET`.

[[d1_databases]]
binding = "DB"
database_name = "re-workspace-db"
database_id = "c5532a8c-2d69-4474-8f42-58d2f96354cd"

# Custom domain routing
# routes = [
#   { pattern = "auth.primeamericarealestate.com/*", zone_name = "primeamericarealestate.com" }
# ]
